name: loop · daily 09:00 CT · upload from R2

# The upload lane, off the owner's Mac.
#
# It pulls the next pending episode's render and thumbnail from Cloudflare R2,
# uploads to YouTube as PRIVATE with the publishAt date the locked cadence
# assigns, sets the thumbnail, and commits the updated loop/state/ledger.json so
# tomorrow's run knows what is already done.
#
# This replaces the launchd agent com.howweknow.backfill, which needed the
# laptop awake at 09:00. The two must never both run: they draw from the same
# ranked queue and the same daily quota, and neither can see the other's
# in-flight work.
#
# THE COMMIT-BACK. bin/loop-stage.sh commits loop/ and pushes with GITHUB_TOKEN.
# A GITHUB_TOKEN push raises no `push` event, so no other workflow triggers off
# it. That is fine here — nothing needs to.
#
# 14:00 UTC is 09:00 America/Chicago during CDT. The exact minute does not
# matter: this lane only SCHEDULES videos, it never makes one public. The
# publish times themselves are computed in local time by loop/backfill.py's
# slots(), so they do not drift when the clocks change even though this cron
# does.
on:
  # ARMED. The schedule fires; loop/arming.py decides whether this run
  # may act. Until the upload-cloud lane has completed one real end-to-end run
  # it takes the NAMED STOP LANE_NOT_ARMED_UPLOAD_CLOUD,
  # which is visible in the issue tracker - unlike the commented-out cron
  # this replaces, which could never be satisfied because the lane it
  # gated could never run. A workflow_dispatch run always passes through
  # and is what arms it.
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max videos this run (4 is the quota-safe number)'
        required: false
        default: '4'
      dry_run:
        description: 'Plan only — resolve the shelf and the slots, upload nothing'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

# Shared with every other loop stage that writes loop/state/. Two stages
# committing the ledger at once is a rebase race, not a merge.
concurrency:
  group: loop-state
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Pinned to the major the `wrangler r2 object` contract in loop/r2.py was
      # verified against. Installed as its own step so a broken install fails
      # here, loudly, rather than half way through an upload.
      - name: Install wrangler
        run: npm install -g wrangler@4
      - name: Install loop dependencies
        run: pip install -r requirements-loop.txt
      # See loop-reach.yml for why this exists: a scope missing from
      # YT_OAUTH_REFRESH_TOKEN must fail here, by name, before any quota is
      # spent - not surface as a 403 mid-upload. auth/check_ci_scopes.py
      # checks against auth/tokens.py:T.SCOPES, never a copy of it.

      # ACT ON THE STATE THIS JOB WILL BE JUDGED AGAINST.
      #
      # A run's SHA is pinned when it is QUEUED, not when it starts. Every lane
      # in the `loop-state` concurrency group waits behind the others, so a lane
      # routinely sits in the queue while another pushes a new ledger — then
      # checks out the older commit it was pinned to.
      #
      # `bin/loop-stage.sh` pulls at the END of each stage, so state moves
      # forward mid-job. On 2026-09-07 that produced a failure that looked like a
      # caption bug and was not: reach's captions stage ran against a ledger with
      # 13 videos, the pull after it brought in two the upload lane had just
      # added, and V16 then failed for two videos the captions stage never had a
      # chance to see (run 34136862505). Neither stage was wrong.
      #
      # Pulling here means every stage in the job, and the validators that judge
      # them, read the same state.
      - name: Refresh to the current main before any stage acts
        run: |
          git fetch --quiet origin ${{ github.ref_name }}
          before="$(git rev-parse --short HEAD)"
          git reset --hard --quiet "origin/${{ github.ref_name }}"
          after="$(git rev-parse --short HEAD)"
          if [ "$before" = "$after" ]; then
            echo "already current at $after"
          else
            echo "advanced $before -> $after (queued behind another lane's push)"
          fi
      - name: Verify the CI YouTube credential's scopes
        env:
          YT_OAUTH_CLIENT_JSON: ${{ secrets.YT_OAUTH_CLIENT_JSON }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
        run: python3 auth/check_ci_scopes.py
      - name: Pull from R2 and upload to YouTube, private and dated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOT a secret, and deliberately literal. Without it wrangler resolves
          # the account through /memberships, which an R2-scoped token cannot
          # read, and every r2 command fails with `Authentication error
          # [code: 10000]` — an error that reads exactly like a broken token and
          # is not. See THE TRAP in loop/r2.py.
          CLOUDFLARE_ACCOUNT_ID: 8d147e242033699dd37c6f5a451f48d2
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # There is no .secrets/ on a runner, so loop/upload.py falls through
          # to these. Absent -> a named OAUTH_MISSING stop, never a crash.
          YT_OAUTH_CLIENT_JSON: ${{ secrets.YT_OAUTH_CLIENT_JSON }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || 4 }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          bin/loop-stage.sh cloud-upload loop/cloud_upload.py $ARGS
      # THE HAND-OFF (owner decision 2026-10-03, loop/handoff.py). Runs after
      # the lane whatever the lane did: a Short or episode that went public
      # since the last run gets its episode link, its channel comment, its
      # Shorts block and its playlist row. Nothing to do is a self-resolving
      # HANDOFF_UP_TO_DATE; quota short is HANDOFF_QUOTA_DEFERRED and the rest
      # is done next run. Same credential as the lane above.
      - name: Hand Shorts off to their episodes and keep the playlists complete
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_OAUTH_CLIENT_JSON: ${{ secrets.YT_OAUTH_CLIENT_JSON }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
        run: bin/loop-stage.sh handoff loop/handoff.py
