name: loop · 1st 07:00 · monthly review
# Reads a month of measurement and says what to change.
#
# Runs on the 1st so it reviews a completed month, not a partial one. 07:12
# rather than 07:00 because every scheduled job on the planet lands on the hour.
#
# This exists because measure.py writes numbers into a JSON file and nobody reads
# a JSON file. A finding nobody sees is the same as no finding.
on:
  schedule:
    - cron: '12 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install loop dependencies
        run: pip install -r requirements-loop.txt
      # Owner 2026-10-12: "use my claude subscription usage in advance of the
      # $0 openrouter". The headless Claude Code CLI, pinned; loop/llm_router.py
      # asks it first and falls back to the $0 list on any failure.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the Claude Code CLI (subscription tier, pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      # Print-only: shows whether the subscription tier answers today. Never
      # fails the job; the stage falls back to the $0 route by itself. Same
      # flags as loop/llm_router.py (not --bare: --bare never reads the OAuth
      # token).
      - name: Probe the Claude subscription tier (print only)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cd "$(mktemp -d)"
          { claude -p --output-format json --model opus --max-turns 1 --tools "" \
              --no-session-persistence --setting-sources "" --strict-mcp-config \
              --disable-slash-commands --exclude-dynamic-system-prompt-sections \
              --system-prompt "Answer in one word." <<< "Reply with exactly: ok" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("[claude-route] probe:", d.get("subtype"), "is_error=%s" % d.get("is_error"), repr(str(d.get("result"))[:80]))'; } \
            || echo "[claude-route] probe failed; the stage falls back to the \$0 route"
      - name: Review the month
        env:
          # loop/monthly.py -> loop/advise.py -> loop/llm_router.py. Until
          # 2026-10-12 this step had no key, so the advisory always skipped;
          # the $0 key lets advise.py run, and the subscription answers first.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Her Claude subscription answers first (prepaid, no per-call bill);
          # absent or failing -> the $0 OpenRouter route, unchanged.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bin/loop-stage.sh monthly-review loop/monthly.py

      # The review is worthless sitting in a file nobody opens. loop-stage.sh only
      # raises an issue on a NAMED STOP (exit 3), and this stage deliberately always
      # exits 0 - thin data and an applied change are both normal operation, not
      # faults. So the report gets its own delivery: a NEW issue each month, which is
      # a fresh email, rather than a comment on a thread that stops notifying.
      #
      # `if: always()` because the report is the point. If the stage itself failed,
      # that is exactly the month she most needs to see.
      - name: Deliver the report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MONTH="$(date -u +%Y-%m)"
          FILE="loop/state/monthly/${MONTH}.md"
          if [ ! -s "$FILE" ]; then
            echo "no report at $FILE - the stage did not produce one"
            exit 1
          fi
          BODY="$(mktemp)"
          cat "$FILE" > "$BODY"
          {
            echo
            echo "---"
            echo
            echo "Decided automatically. Any change above is already applied to"
            echo "\`loop/config.json\` and is live for the next drafting cycle -"
            echo "nothing is waiting on you. Overrule by editing that file."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$BODY"

          gh issue create \
            --title "Monthly review — ${MONTH}" \
            --body-file "$BODY" \
            --label monthly-review >/dev/null 2>&1 \
            || gh issue create --title "Monthly review — ${MONTH}" --body-file "$BODY" >/dev/null
          echo "delivered the ${MONTH} review"

          # Close last month's so the issue list stays a signal rather than a pile.
          PREV="$(date -u -d '1 month ago' +%Y-%m 2>/dev/null || date -u -v-1m +%Y-%m)"
          OLD="$(gh issue list --state open --search "Monthly review — ${PREV} in:title" \
                 --json number --jq '.[0].number' 2>/dev/null)"
          if [ -n "$OLD" ] && [ "$OLD" != "null" ]; then
            gh issue close "$OLD" --comment "Superseded by the ${MONTH} review." >/dev/null 2>&1 \
              && echo "closed #$OLD"
          fi
