name: loop · 1st 07:00 · monthly review
# Reads a month of measurement and says what to change.
#
# Runs on the 1st so it reviews a completed month, not a partial one. 07:12
# rather than 07:00 because every scheduled job on the planet lands on the hour.
#
# This exists because measure.py writes numbers into a JSON file and nobody reads
# a JSON file. A finding nobody sees is the same as no finding.
on:
  schedule:
    - cron: '12 2 1 * *'  # America/Chicago, all year
      timezone: America/Chicago
  # On demand (owner, 2026-10-12): the monthly EMAIL for this month to date.
  # `full-review` also re-runs loop/monthly.py, which may change
  # loop/config.json, so it is opt-in; the default only reports.
  workflow_dispatch:
    inputs:
      mode:
        description: 'email-to-date (report only) or full-review (also run the review)'
        type: choice
        options: [email-to-date, full-review]
        default: email-to-date

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install loop dependencies
        run: pip install -r requirements-loop.txt
      # 2026-11-04 (owner, via the coordinator): no Claude in these lanes;
      # loop/llm_router.py uses Gemini free tier then the $0 OpenRouter list only.
      - name: Review the month
        if: github.event_name == 'schedule' || inputs.mode == 'full-review'
        env:
          # loop/monthly.py -> loop/advise.py -> loop/llm_router.py. Until
          # 2026-10-12 this step had no key, so the advisory always skipped;
          # the $0 key lets advise.py run, and the subscription answers first.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bin/loop-stage.sh monthly-review loop/monthly.py

      # The review is worthless sitting in a file nobody opens. loop-stage.sh only
      # raises an issue on a NAMED STOP (exit 3), and this stage deliberately always
      # exits 0 - thin data and an applied change are both normal operation, not
      # faults. So the report gets its own delivery: a NEW issue each month, which is
      # a fresh email, rather than a comment on a thread that stops notifying.
      #
      # `if: always()` because the report is the point. If the stage itself failed,
      # that is exactly the month she most needs to see.
      - name: Deliver the report
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'full-review')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MONTH="$(date -u +%Y-%m)"
          FILE="loop/state/monthly/${MONTH}.md"
          if [ ! -s "$FILE" ]; then
            echo "no report at $FILE - the stage did not produce one"
            exit 1
          fi
          BODY="$(mktemp)"
          # @-mention: an issue opened by Actions is neither "participating"
          # nor a mention, so without this line no email is ever sent (the
          # Sunday digest found this; the review never had it).
          { echo "@seq23"; echo; cat "$FILE"; } > "$BODY"
          {
            echo
            echo "---"
            echo
            echo "Decided automatically. Any change above is already applied to"
            echo "\`loop/config.json\` and is live for the next drafting cycle -"
            echo "nothing is waiting on you. Overrule by editing that file."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$BODY"

          gh issue create \
            --title "Monthly review — ${MONTH}" \
            --body-file "$BODY" \
            --label monthly-review >/dev/null 2>&1 \
            || gh issue create --title "Monthly review — ${MONTH}" --body-file "$BODY" >/dev/null
          echo "delivered the ${MONTH} review"

          # Close last month's so the issue list stays a signal rather than a pile.
          PREV="$(date -u -d '1 month ago' +%Y-%m 2>/dev/null || date -u -v-1m +%Y-%m)"
          OLD="$(gh issue list --state open --search "Monthly review — ${PREV} in:title" \
                 --json number --jq '.[0].number' 2>/dev/null)"
          if [ -n "$OLD" ] && [ "$OLD" != "null" ]; then
            gh issue close "$OLD" --comment "Superseded by the ${MONTH} review." >/dev/null 2>&1 \
              && echo "closed #$OLD"
          fi

      # THE MONTHLY EMAIL (owner, 2026-10-12): what was published, what the
      # data says, and whether any keep/change/pivot rule triggered. On the
      # 1st it reports the month just ended; on demand, this month to date.
      # Its advisory paragraph goes through loop/advise.py -> llm_router.py,
      # her subscription first.
      - name: Write the monthly email
        if: always()
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            bin/loop-stage.sh monthly-email loop/monthly_email.py
          else
            bin/loop-stage.sh monthly-email loop/monthly_email.py --now
          fi

      # Same send mechanism as the Sunday digest: a NEW issue that @-mentions
      # the owner, titled by the stage's .subject line.
      - name: Send the monthly email
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MONTH="$(date -u -d '1 month ago' +%Y-%m 2>/dev/null || date -u -v-1m +%Y-%m)"
          else
            MONTH="$(date -u +%Y-%m)"
          fi
          FILE="loop/state/monthly/${MONTH}-email.md"
          if [ ! -s "$FILE" ]; then
            echo "no monthly email at $FILE - the stage did not produce one"
            exit 1
          fi
          TITLE="$(head -n 1 "loop/state/monthly/${MONTH}-email.subject" 2>/dev/null)"
          [ -n "$TITLE" ] || TITLE="Monthly: ${MONTH}"
          BODY="$(mktemp)"
          {
            echo "@seq23"
            echo
            cat "$FILE"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$BODY"
          URL="$(gh issue create --title "$TITLE" --body-file "$BODY" --label monthly-email 2>/dev/null \
                 || gh issue create --title "$TITLE" --body-file "$BODY")"
          echo "sent: ${TITLE}"
          echo "issue: ${URL}"
