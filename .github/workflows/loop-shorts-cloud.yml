name: loop · daily 18:00 CT · publish a Short from R2

# The Shorts lane, off the owner's Mac.
#
# Pulls a verified Short from Cloudflare R2, uploads it to YouTube as PRIVATE
# with the EVENING slot loop/shorts_lane.py assigns (19:00 America/Chicago on
# Mon, Wed, Fri, Sat), and commits loop/state/shorts_ledger.json back.
#
# WHY THE CUTTING IS NOT HERE. V14 (attribution) and V15 (caption crop) read the
# finished pixels with Apple's Vision framework, which does not exist on
# ubuntu-latest. Cutting here would mean running neither, and an unrun validator
# is not a passing one — so the cut and its verification stay on the Mac, and
# loop/r2.py:push_shorts() refuses to shelve anything that fails them. Nothing
# unverified can reach this workflow. The full argument is in the header of
# loop/shorts_cloud.py.
#
# There is deliberately no ffmpeg and no Pillow step: this lane does not cut,
# it publishes.
#
# 23:00 UTC is 18:00 America/Chicago during CDT — an hour before the earliest
# slot it hands out, so a Short is never uploaded after the time it was meant to
# go live. The slots themselves are computed in local time and do not drift when
# the clocks change, even though this cron does.
on:
  # ARMED. The schedule fires; loop/arming.py now decides on every run
  # whether a SCHEDULED trigger may act (a workflow_dispatch always may) —
  # see loop/state/lane_evidence.json. Before loop/arming.py existed, this
  # lane was armed by hand, by uncommenting the cron below once real evidence
  # existed. That evidence is preserved here rather than deleted, and the
  # merge that introduced loop/arming.py seeded lane_evidence.json from it
  # directly (see that commit) so this real, already-proven success is not
  # forgotten and re-demanded from a live channel a second time.
  #
  # THE RUN THAT FIRST ARMED IT. 2026-09-03, dispatched `-f limit=1`: the lane
  # pulled the verified Short for 10-what-is-the-deepest-part-of-the-ocean
  # from r2://how-we-know-renders and uploaded it as video HZhm2dXaR9c.
  # Confirmed afterwards against videos.list on @howweknowdeep —
  # privacyStatus=private, publishAt=2026-09-04T00:00:00Z,
  # uploadStatus=processed. Private with a future slot is exactly the
  # contract this lane promises, so the credential path was proven and not
  # merely un-crashed.
  #
  # If the credentials or the upload path ever change enough to doubt that
  # proof, re-prove it the same way:
  #     gh workflow run loop-shorts-cloud.yml -f dry_run=true
  #     gh workflow run loop-shorts-cloud.yml -f limit=1
  # then check the new id is private with a publishAt before trusting the
  # cron — a fresh dispatch always passes the gate regardless of what
  # lane_evidence.json says, and a fresh loop/arming.py record_success() call
  # from it updates lane_evidence.json to the new proof.
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max Shorts this run'
        required: false
        default: '2'
      dry_run:
        description: 'Plan only — resolve the shelf and the slots, upload nothing'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

# Shared with every other loop stage that writes loop/state/, including the
# episode upload lane. Both spend from one 10,000-unit daily YouTube allowance
# through loop/quota.py, and that account is a file in this repo — two stages
# committing it at once is a rebase race, not a merge.
concurrency:
  group: loop-state
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        run: npm install -g wrangler@4
      - name: Install loop dependencies
        run: pip install -r requirements-loop.txt
      # See loop-reach.yml for why this exists: a scope missing from
      # YT_OAUTH_REFRESH_TOKEN must fail here, by name, before any quota is
      # spent - not surface as a 403 mid-upload. auth/check_ci_scopes.py
      # checks against auth/tokens.py:T.SCOPES, never a copy of it.

      # ACT ON THE STATE THIS JOB WILL BE JUDGED AGAINST.
      #
      # A run's SHA is pinned when it is QUEUED, not when it starts. Every lane
      # in the `loop-state` concurrency group waits behind the others, so a lane
      # routinely sits in the queue while another pushes a new ledger — then
      # checks out the older commit it was pinned to.
      #
      # `bin/loop-stage.sh` pulls at the END of each stage, so state moves
      # forward mid-job. On 2026-09-07 that produced a failure that looked like a
      # caption bug and was not: reach's captions stage ran against a ledger with
      # 13 videos, the pull after it brought in two the upload lane had just
      # added, and V16 then failed for two videos the captions stage never had a
      # chance to see (run 34136862505). Neither stage was wrong.
      #
      # Pulling here means every stage in the job, and the validators that judge
      # them, read the same state.
      - name: Refresh to the current main before any stage acts
        run: |
          git fetch --quiet origin ${{ github.ref_name }}
          before="$(git rev-parse --short HEAD)"
          git reset --hard --quiet "origin/${{ github.ref_name }}"
          after="$(git rev-parse --short HEAD)"
          if [ "$before" = "$after" ]; then
            echo "already current at $after"
          else
            echo "advanced $before -> $after (queued behind another lane's push)"
          fi
      - name: Verify the CI YouTube credential's scopes
        env:
          YT_OAUTH_CLIENT_JSON: ${{ secrets.YT_OAUTH_CLIENT_JSON }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
        run: python3 auth/check_ci_scopes.py
      - name: Pull a verified Short from R2 and schedule it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOT a secret, and deliberately literal — see THE TRAP in loop/r2.py.
          CLOUDFLARE_ACCOUNT_ID: 8d147e242033699dd37c6f5a451f48d2
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YT_OAUTH_CLIENT_JSON: ${{ secrets.YT_OAUTH_CLIENT_JSON }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || 2 }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          bin/loop-stage.sh shorts-cloud loop/shorts_cloud.py $ARGS
