name: loop · daily 14:00 CT · whisper almanac author (sleep, teaching and affirmation scripts, $0)

# THE WHISPER ALMANAC LANE'S CLOUD HALF (6 Nov 2026). loop/whisper_author.py
# rewrites fact-checked How We Know scripts for sleep (plain words, no new
# facts, 2-3 hours, distinct) into scripts/whisper/<slug>.md, and writes the
# week's money-or-love affirmations script, through the same $0 route as every
# lane (Gemini free tier, then the curated $0 OpenRouter list, never paid).
# The Mac voices them in the nightly batch, under the narrator lock
# (bin/batch-session.sh phase_whisper). Only a script that passes every rule
# is committed; a full runway is the self-resolving stop WHISPER_RUNWAY_FULL.
#
# CADENCE: daily (13 Nov 2026; it was weekly). The mix is 5 videos a week
# (config/whisper_almanac.json `mix`) and the Mac voices one a night, so a
# weekly run left it with nothing to voice; the runway cap (RUNWAY scripts
# waiting per lane, MAX_WRITES a run) keeps a daily run from piling up, and a
# full runway is the self-resolving WHISPER_RUNWAY_FULL. 14:00 CT: after the
# 09:00 upload, in the loop-state group, so no two lanes push over each
# other. loop/lanes.py lists this lane; V73 holds it to this file.
on:
  schedule:
    - cron: '0 14 * * *'  # America/Chicago, all year - daily (13 Nov 2026: 5 videos a week; a weekly run starved the Mac)
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: loop-state
  cancel-in-progress: false

jobs:
  whisper-author:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install loop dependencies
        run: pip install -r requirements-loop.txt
      - name: Refresh to the current main before any stage acts
        run: |
          git fetch --quiet origin ${{ github.ref_name }}
          git reset --hard --quiet "origin/${{ github.ref_name }}"
      - name: Write the next whisper scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bin/loop-stage.sh whisper-author loop/whisper_author.py
