name: loop · Sun 12:00 · weekly digest

# THE ONE EMAIL A WEEK THAT ARRIVES WHEN NOTHING IS WRONG.
#
# Everything the loop decides is already recorded - the ledger, the breaker, the
# stop files, the monthly review. None of it reached the owner. The only things
# that email her are a NAMED STOP and the monthly review, so in a healthy week
# the channel is completely silent. Her instruction is that the system decides
# and she is TOLD at intervals; a system that only speaks when it is in trouble
# satisfies the first half and not the second.
#
# It carries no decisions and asks for none. Every number in it was already
# decided and applied by the lane that owns it, so if this stage stopped running
# nothing about the channel would change - which is exactly the property that
# lets it be read in thirty seconds and skipped in a busy week.
#
# 11:00 America/Chicago (12:00 America/New_York) all year - after Sunday's ranking lane
# (05:00 CT) and after the 10:00 CT long-form flip, so the digest reports the
# week that just closed and the episode that just went out, not a week still in
# progress.
on:
  schedule:
    - cron: '0 11 * * 0'  # America/Chicago, all year
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: loop-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # was 15; ~4x median 0.4m over 6 green runs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install loop dependencies
        run: pip install -r requirements-loop.txt

      # ACT ON THE STATE THIS JOB WILL BE JUDGED AGAINST.
      #
      # A run's SHA is pinned when it is QUEUED, not when it starts. Every lane
      # in the `loop-state` concurrency group waits behind the others, so a lane
      # routinely sits in the queue while another pushes a new ledger — then
      # checks out the older commit it was pinned to.
      #
      # `bin/loop-stage.sh` pulls at the END of each stage, so state moves
      # forward mid-job. On 2026-09-07 that produced a failure that looked like a
      # caption bug and was not: reach's captions stage ran against a ledger with
      # 13 videos, the pull after it brought in two the upload lane had just
      # added, and V16 then failed for two videos the captions stage never had a
      # chance to see (run 34136862505). Neither stage was wrong.
      #
      # Pulling here means every stage in the job, and the validators that judge
      # them, read the same state.
      - name: Refresh to the current main before any stage acts
        run: |
          git fetch --quiet origin ${{ github.ref_name }}
          before="$(git rev-parse --short HEAD)"
          git reset --hard --quiet "origin/${{ github.ref_name }}"
          after="$(git rev-parse --short HEAD)"
          if [ "$before" = "$after" ]; then
            echo "already current at $after"
          else
            echo "advanced $before -> $after (queued behind another lane's push)"
          fi

      - name: Render the week
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read-only: the digest lists the R2 shorts/ shelf at render time
          # (loop/digest.py r2_shelf_now) instead of mailing a stale count.
          CLOUDFLARE_ACCOUNT_ID: 8d147e242033699dd37c6f5a451f48d2
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bin/loop-stage.sh weekly-digest loop/digest.py

      # The digest sitting in a file nobody opens is the exact failure the
      # monthly review already had to solve. Same delivery: a NEW issue each
      # week, which is a fresh email, rather than a comment on a thread that
      # stops notifying. `if: always()` because a week the stage itself failed
      # is the week she most needs to hear from it.
      - name: Deliver it
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK="$(date -u +%G-W%V)"
          FILE="loop/state/digest/${WEEK}.md"
          if [ ! -s "$FILE" ]; then
            echo "no digest at $FILE — the stage did not produce one"
            exit 1
          fi
          BODY="$(mktemp)"
          # NO @-MENTION, ON PURPOSE (owner, 1 Nov 2026). The mention is what made
          # GitHub email her this digest; the week now goes to Boss OS's one
          # "Spry Labs weekly" email instead (the next step). The issue is still
          # opened and closed as before: it is the record.
          {
            cat "$FILE"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$BODY"

          # THE VERDICT IS THE SUBJECT. loop/digest.py writes one line per week
          # ("🔴 Shorts stopped: 1 of 9 published this week, … — needs you: check the
          # Mac's nightly batch — 2026-W42"): one plain sentence, worst problem first.
          # Last week's issue is found by its label and week, not a title prefix.
          # so the inbox is the dashboard. Falls back to the plain title if the
          # stage did not write one, never to no email.
          TITLE="$(head -n 1 "loop/state/digest/${WEEK}.subject" 2>/dev/null)"
          [ -n "$TITLE" ] || TITLE="Weekly digest — ${WEEK}"
          # The label never existed, so every digest went out unlabelled; make it.
          gh label create weekly-digest --color 0E8A16 \
            --description "Sunday digest" >/dev/null 2>&1 || true
          gh issue create \
            --title "$TITLE" \
            --body-file "$BODY" \
            --label weekly-digest >/dev/null 2>&1 \
            || gh issue create --title "$TITLE" --body-file "$BODY" >/dev/null
          echo "recorded the ${WEEK} digest (no email: it goes to the Spry Labs weekly)"

          # Close last week's, so the issue list stays a signal and not a pile.
          PREV="$(date -u -d 'last week' +%G-W%V 2>/dev/null || date -u -v-1w +%G-W%V)"
          # By week in the title, minus the "loop: <lane> needs you — <week>" stop
          # issues; label-free so the unlabelled digests before 12 Oct close too.
          OLD="$(gh issue list --state open --search "${PREV} in:title" --limit 30 \
                 --json number,title \
                 --jq "[.[] | select((.title | startswith(\"loop:\") | not) and (.title | endswith(\"${PREV}\")))][0].number" \
                 2>/dev/null)"
          if [ -n "$OLD" ] && [ "$OLD" != "null" ]; then
            gh issue close "$OLD" --comment "Superseded by the ${WEEK} digest." >/dev/null 2>&1 \
              && echo "closed #$OLD"
          fi

      - name: Hand the week to Boss OS (the Spry Labs weekly email)
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 loop/spry_weekly_summary.py --self-check
          python3 loop/spry_weekly_summary.py "$(date -u +%G-W%V)" spry-weekly-summary.json

      - name: Upload the summary for Boss OS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spry-weekly-summary
          path: spry-weekly-summary.json
          if-no-files-found: error
          retention-days: 30
