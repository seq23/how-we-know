name: loop · daily 11:00 CT · money author (next Money episode, $0)

# THE MONEY LANE'S CLOUD HALF (her calls 8-9 Nov 2026: How We Know's Money
# lane, a 12-video test on both long-form nights). loop/money_author.py writes
# the next Money topic (config/money_topics.json, rank order) through the same
# $0 route as mon-draft (Gemini free tier, the free OpenRouter list, never
# paid) and the full validator set, into scripts/<slug>.md and
# research/publish_order_money_and_business.json. The Mac's nightly batch
# narrates it first on How We Know's nights (Mon + Fri; loop/night_split.py).
#
# CADENCE: daily 11:00 CT (13 Nov 2026; it was Sun + Thu 14:00). The free
# models fail a topic some days, and with two runs a week one bad day left a
# How We Know night with no Money script. At most two scripts are in flight
# (MONEY_EPISODE_IN_FLIGHT, self-resolving), so a daily run cannot pile up.
# 11:00: after the 10:00 reach lane and before the 14:00 whisper and food
# authors, in the loop-state concurrency group, so no two lanes push over each
# other. loop/lanes.py lists this lane; V73 holds it to this file.
on:
  schedule:
    - cron: '0 11 * * *'  # America/Chicago, all year - daily; at most two scripts in flight
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: loop-state
  cancel-in-progress: false

jobs:
  money-author:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install loop dependencies
        run: pip install -r requirements-loop.txt
      # 2026-11-04: no Claude CLI; loop/llm_router.py uses Gemini free tier then $0 OpenRouter only.
      - name: Refresh to the current main before any stage acts
        run: |
          git fetch --quiet origin ${{ github.ref_name }}
          git reset --hard --quiet "origin/${{ github.ref_name }}"
      - name: Author the next Money episode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bin/loop-stage.sh money-author loop/money_author.py
