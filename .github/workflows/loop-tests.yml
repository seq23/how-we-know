name: loop · tests

on:
  push:
    paths: ['loop/**', 'auth/**', 'bin/loop-*.sh', '.github/workflows/**',
            'scripts/**', 'pov/**', 'docs/CHANNEL-PLAN.md', 'research/publish_order.json',
            '.gitattributes']
  pull_request:
  workflow_dispatch:
  # Every lane that commits loop state to main, re-tested on main when it
  # finishes. Their pushes use GITHUB_TOKEN, which never fires `push`, so until
  # 2026-10-17 the state a lane committed was first tested by the NEXT human or
  # Mac push: the Sat imagery-harvest and weekly-score commits redded main and
  # the red landed on the Mac's backfill (run 39039023653). Now the red is on
  # the lane that caused it. test_registry_green_on_main.py pins this list to
  # every committing workflow.
  workflow_run:
    workflows:
      - 'loop · daily demand + Mon 08:30 CT email'
      - 'loop · Fri 17:00 · measure'
      - 'loop · Fri 09:00 · flip to public'
      - 'loop · Sat 04:00 UTC · grow the rights-cleared footage pool'
      - 'loop · Mon 00:00 CT · draft, validate, gate'
      - 'loop · Mon 14:00 CT · food author (next food episode, $0)'
      - 'loop · 1st 07:00 · monthly review'
      - 'loop · owner override'
      - 'loop · Quarterly · refresh the candidate-niche taxonomy'
      - 'loop · daily 10:00 CT · reach (captions + localizations + tags)'
      - 'loop · daily 18:30 CT (+ 03:30 CT apply) · long-form repackage (titles + thumbnails)'
      - 'loop · Sat 06:00 · score demand ÷ competition'
      - 'loop · daily 18:00 CT · publish a Short from R2'
      - 'loop · Sun 12:00 · weekly digest'
      - 'loop · Sun 06:00 · rank topics'
      - 'loop · daily 09:00 CT · upload from R2'
      - 'search console · daily truth, coverage and sitemap status'
    types: [completed]

permissions:
  contents: read

# THE MERGE GATE AND THE LONG SUITE (search readiness h5)
#
# The gate is `test`; the long suite is `long-suite`, which runs on main after
# merge and never blocks a pull request. On 2026-10-26 the median PR run was 6.4
# minutes against a five-minute target, and sharding could not fix it: five files
# were 468s of a 625s suite (test_stage_write_set_is_committed.py alone was
# 274s). loop/tests/slow_tests.txt is the one list, read by --skip-slow here and
# --only-slow below; test_registry_green_on_main.py asserts the two sets are
# every test_*.py between them, so nothing falls through the split.
#
# Nothing is skipped: a red long suite on main blocks the next deploy the way a
# red gate blocks a merge.
jobs:
  test:
    timeout-minutes: 8  # ~3x the fast set's measured time; fault detector, not a budget
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]  # run_all.py --shard K/2; every shard named here (test_registry_green_on_main.py)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install loop dependencies
        run: pip install -r requirements-loop.txt
      - name: Install the one dependency the tests need
        run: pip install --quiet pyyaml
      - name: Loop tests
        run: python loop/tests/run_all.py --shard ${{ matrix.shard }}/2 --skip-slow
      - name: Conformance with the locked plan
        run: python loop/validate_plan.py
      - name: Shell syntax
        run: for f in bin/loop-*.sh; do bash -n "$f"; done

  long-suite:
    # The five long files, on main after merge and on the lanes' own completions.
    # Never on a pull request: that is the whole point of the split.
    if: github.event_name != 'pull_request'
    needs: test
    timeout-minutes: 20  # ~4x the measured ~5m; fault detector, not a budget
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]  # run_all.py --only-slow --shard K/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install loop dependencies
        run: pip install -r requirements-loop.txt
      - name: Install the one dependency the tests need
        run: pip install --quiet pyyaml
      - name: The long suite
        run: python loop/tests/run_all.py --shard ${{ matrix.shard }}/2 --only-slow
