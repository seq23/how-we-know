name: loop · tests

on:
  push:
    paths: ['loop/**', 'auth/**', 'bin/loop-*.sh', '.github/workflows/**',
            'scripts/**', 'pov/**', 'docs/CHANNEL-PLAN.md', 'research/publish_order.json',
            '.gitattributes']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 8  # ~3x median 2.3m over 8 green runs; fault detector, not a budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install loop dependencies
        run: pip install -r requirements-loop.txt
      - name: Install the one dependency the tests need
        run: pip install --quiet pyyaml
      - name: Loop tests
        run: python loop/tests/run_all.py
      - name: Conformance with the locked plan
        run: python loop/validate_plan.py
      - name: Shell syntax
        run: for f in bin/loop-*.sh; do bash -n "$f"; done
