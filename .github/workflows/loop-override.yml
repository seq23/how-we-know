name: loop · owner override

# There is no approval gate. Topics are picked automatically under the hard
# exclusion gate and POV lines come from the owner's own bank, so nothing waits
# on her. This is the veto path: if she drops a row from the dashboard, it opens
# a prefilled issue and this ingests it. The window closes Tuesday 02:00.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: loop-state
  cancel-in-progress: false

jobs:
  override:
    if: >
      startsWith(github.event.issue.title, 'OVERRIDE ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the override
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          set -uo pipefail
          WEEK="${ISSUE_TITLE#OVERRIDE }"
          printf '%s' "$ISSUE_BODY" > /tmp/override.txt
          bin/loop-stage.sh override loop/override.py \
            --week "$WEEK" --body-file /tmp/override.txt --by "$ISSUE_USER"
      - name: Acknowledge and close
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Override applied. Everything not dropped still ships; the Mac renders at Tuesday 02:00."
          gh issue close "${{ github.event.issue.number }}"
