name: loop · owner override

# There is no approval gate. Topics are picked automatically under the hard
# exclusion gate and POV lines come from the owner's own bank, so nothing waits
# on her. This is the veto path: if she drops a row from the dashboard, it opens
# a prefilled issue and this ingests it. The window closes Tuesday 02:00.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: loop-state
  cancel-in-progress: false

jobs:
  override:
    timeout-minutes: 30  # no successful run history yet; default ceiling, revisit once it has runs
    if: >
      startsWith(github.event.issue.title, 'OVERRIDE ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install loop dependencies
        run: pip install -r requirements-loop.txt

      # ACT ON THE STATE THIS JOB WILL BE JUDGED AGAINST.
      #
      # A run's SHA is pinned when it is QUEUED, not when it starts. Every lane
      # in the `loop-state` concurrency group waits behind the others, so a lane
      # routinely sits in the queue while another pushes a new ledger — then
      # checks out the older commit it was pinned to.
      #
      # `bin/loop-stage.sh` pulls at the END of each stage, so state moves
      # forward mid-job. On 2026-09-07 that produced a failure that looked like a
      # caption bug and was not: reach's captions stage ran against a ledger with
      # 13 videos, the pull after it brought in two the upload lane had just
      # added, and V16 then failed for two videos the captions stage never had a
      # chance to see (run 34136862505). Neither stage was wrong.
      #
      # Pulling here means every stage in the job, and the validators that judge
      # them, read the same state.
      - name: Refresh to the current main before any stage acts
        run: |
          git fetch --quiet origin ${{ github.ref_name }}
          before="$(git rev-parse --short HEAD)"
          git reset --hard --quiet "origin/${{ github.ref_name }}"
          after="$(git rev-parse --short HEAD)"
          if [ "$before" = "$after" ]; then
            echo "already current at $after"
          else
            echo "advanced $before -> $after (queued behind another lane's push)"
          fi
      - name: Apply the override
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          set -uo pipefail
          WEEK="${ISSUE_TITLE#OVERRIDE }"
          printf '%s' "$ISSUE_BODY" > /tmp/override.txt
          bin/loop-stage.sh override loop/override.py \
            --week "$WEEK" --body-file /tmp/override.txt --by "$ISSUE_USER"
      - name: Acknowledge and close
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Override applied. Everything not dropped still ships; the Mac renders at Tuesday 02:00."
          gh issue close "${{ github.event.issue.number }}"
