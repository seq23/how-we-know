name: loop · daily 18:30 CT (+ 03:30 CT apply) · long-form repackage (titles + thumbnails)

# The long-form REPACKAGE lane (owner decisions 12-13 Oct 2026; loop/repackage.py).
# LONG-FORM ONLY. Shorts - their titles, thumbnails, the R2 drain and
# loop-shorts-cloud.yml - are not touched here.
#
#   1. propose   loop/longform_title.py drafts a passing long-form title for
#                every not-yet-uploaded script that lacks one (the upload lane
#                holds a slug until it has one), then for every live long-form
#                video with no passing row in titles.json (`--needed`). $0 model route: her Claude
#                subscription, the Gemini free tier, the $0 OpenRouter list.
#   1b. reopen   loop/lengthen.py re-opens every QUEUED script whose cold open
#                breaks the hook rule (stake-then-payoff) and extends every one
#                under ten minutes (new hook + kept body + warm, sourced tail);
#                the Mac's batch binds each one (`lengthen.py bind`) and
#                re-renders. Published videos are never touched.
#   2. apply     new titles + the contract thumbnail (variant A) onto live
#                videos (public and private-scheduled) in loop/state/titles.json.
#   3. reschedule (dispatch with reschedule=true) re-dates the private,
#                scheduled long-form videos onto the three-niche rotation
#                (cadence.rotation), videos.update only.
#
# FORWARD ONLY (owner, 13 Oct 2026): a published video is never re-rendered,
# re-uploaded, extended or privated - its title and thumbnail are all this
# lane changes. Longer cuts happen only to QUEUED scripts (loop/lengthen.py).
#
# Runs AFTER the 18:00 Shorts lane (same loop-state queue), so the Shorts lane
# has already spent; quota.shorts_reserve() keeps its 3,400 regardless.
#
# SECOND CRON, APPLY ONLY (16 Oct 2026). At 18:30 CT the quota day (PT) is
# nearly spent: 14 Oct left 976 units (9 of 40 applied), 15 Oct left 182
# (1 of 37), so 36 locked titles sat waiting at ~1 a day. '30 8 * * 0,2-6' is
# 01:30 PDT / 00:30 PST (03:30 / 02:30 CT): just after the YouTube quota reset
# in both clock seasons (07:00 UTC PDT, 08:00 UTC PST): the apply step
# alone runs (no propose, re-open, thumbs or describe - those stay at 18:30 so
# the Mac's 23:00 CT batch binds re-opens the same night), behind reserve() =
# the day's episode upload + the Shorts lane, so only deferrable lanes
# (captions, backfill) ever yield to it. Acts
# only while there is work: with none, every step is a green named stop.
#
# ARMED by loop/arming.py like the Shorts lane. Prove it first:
#     gh workflow run loop-repackage.yml -f dry_run=true
#     gh workflow run loop-repackage.yml -f limit=1
on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 8 * * 0,2-6'     # apply only (see above); not Monday: loop-mon-draft owns 05:00 UTC onward
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max items per step this run'
        required: false
        default: '2'
      dry_run:
        description: 'Plan only - write nothing to YouTube'
        type: boolean
        required: false
        default: false
      propose_limit:
        description: 'Max titles to propose this run (queued scripts first, then live videos with no passing title)'
        required: false
        default: '6'
      reopen_limit:
        description: 'Max queued scripts to re-open/extend this run (hook rule, ten-minute floor)'
        required: false
        default: '3'
      propose_published:
        description: 'Re-propose EVERY live long-form video (not only those with no passing title) - after a formula change'
        type: boolean
        required: false
        default: false
      propose_only:
        description: 'Propose titles only; skip apply (so a dry-run apply can be read first)'
        type: boolean
        required: false
        default: false
      reschedule:
        description: 'Also re-date scheduled long-form videos onto the rotation (videos.update only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: loop-state
  cancel-in-progress: false

jobs:
  repackage:
    # New lane: no measured median yet. Titles ~15 s each on the
    # subscription tier (13 Oct: 4 in 60 s); a re-open drafts against the
    # whole script with dead-URL checks, ~2-4 min each, 3 a day by default.
    # A fault detector, not a budget.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the Claude Code CLI (subscription tier, pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Install loop dependencies
        run: pip install -r requirements-loop.txt
      - name: Refresh to the current main before any stage acts
        run: |
          git fetch --quiet origin ${{ github.ref_name }}
          git reset --hard --quiet "origin/${{ github.ref_name }}"
      - name: Verify the CI YouTube credential's scopes
        env:
          YT_OAUTH_CLIENT_JSON: ${{ secrets.YT_OAUTH_CLIENT_JSON }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
        run: python3 auth/check_ci_scopes.py
      - name: Propose long-form titles (queued scripts, then live videos with none)
        if: ${{ github.event.schedule != '30 8 * * 0,2-6' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS="--needed --limit ${{ github.event.inputs.propose_limit || 6 }}"
          if [ "${{ github.event.inputs.propose_published }}" = "true" ]; then
            ARGS="--published --limit ${{ github.event.inputs.propose_limit || 6 }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          bin/loop-stage.sh titles loop/longform_title.py propose $ARGS
      - name: Re-open / extend queued scripts (hook rule, ten-minute floor)
        if: ${{ !cancelled() && github.event.inputs.propose_only != 'true' && github.event.schedule != '30 8 * * 0,2-6' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS="--limit ${{ github.event.inputs.reopen_limit || 3 }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          bin/loop-stage.sh queue-reopen loop/queue_reopen.py $ARGS
      - name: Build contract thumbnails for live videos (words echo the title)
        if: ${{ !cancelled() && github.event.inputs.propose_only != 'true' && github.event.inputs.dry_run != 'true' && github.event.schedule != '30 8 * * 0,2-6' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bin/loop-stage.sh thumbs loop/thumbs_lane.py
      - name: Prepare search blocks for descriptions (autocomplete phrasings, chapter questions)
        if: ${{ !cancelled() && github.event.schedule != '30 8 * * 0,2-6' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS="--needed --limit 60"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          bin/loop-stage.sh describe loop/describe.py prepare $ARGS
      - name: Apply new titles and thumbnails to live videos
        if: ${{ !cancelled() && github.event.inputs.propose_only != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_OAUTH_CLIENT_JSON: ${{ secrets.YT_OAUTH_CLIENT_JSON }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || 40 }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          bin/loop-stage.sh repackage-apply loop/repackage.py apply $ARGS
      - name: Re-date scheduled long-form videos onto the rotation
        if: ${{ !cancelled() && github.event.inputs.reschedule == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_OAUTH_CLIENT_JSON: ${{ secrets.YT_OAUTH_CLIENT_JSON }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          bin/loop-stage.sh repackage-reschedule loop/repackage.py reschedule $ARGS
